name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected to see, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The steps that lead to the problem, as precisely as you can.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of /et-ay:doctor
      description: It contains paths and timings but no prompt text.
      render: text
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: macOS 15.4, Python 3.12.7
    validations:
      required: true
